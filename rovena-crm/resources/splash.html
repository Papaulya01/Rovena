<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      .splash {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #1b2621 0%, #0c1411 100%);
        border-radius: 16px;
        font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
        color: #dfe7e2;
        -webkit-app-region: drag;
      }
      .mark {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        animation: pulse 1.8s ease-in-out infinite;
      }
      .mark img {
        width: 100%;
        height: 100%;
      }
      .title {
        font-size: 22px;
        letter-spacing: 0.02em;
      }
      .sub {
        margin-top: 6px;
        font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 11.5px;
        color: #8ea198;
      }
      .dots {
        margin-top: 22px;
        display: flex;
        gap: 6px;
      }
      .dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #c98a3e;
        animation: bounce 1.2s infinite ease-in-out;
      }
      .dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.04);
        }
      }
      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
          opacity: 0.5;
        }
        40% {
          transform: translateY(-5px);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="mark"><img src="./icon-512.png" alt="" /></div>
      <div class="title">Rovena</div>
      <div class="sub">Загрузка CRM…</div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
  </body>
</html>
